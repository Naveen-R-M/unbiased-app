name: AI Code Review

on:
  pull_request_target:
    types:
      - labeled
    branches:
      - main

concurrency:
  group: ai-review-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.label.name == 'ai-review' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      contains(github.event.pull_request.labels.*.name, 'ai-review')
    uses: circuitandchisel/.github/.github/workflows/ai-review.yml@3c05f8413a35bde66584136e1c16fbdf66c54f54
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
