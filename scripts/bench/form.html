<!doctype html>
<meta charset="utf-8">
<title>Phase 0 benchmark — form</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { color-scheme: light dark; --line:#d5d2cc; --ink:#1b1917; --bg:#faf9f7; --accent:#d97757; }
  @media (prefers-color-scheme: dark) { :root { --line:#3a3733; --ink:#eeebe6; --bg:#1b1917; } }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  main { max-width:620px; margin:0 auto; padding:32px 20px 64px; }
  h1 { font-size:22px; margin:0 0 4px; }
  p.sub { margin:0 0 28px; opacity:.65; font-size:13px; }
  fieldset { border:1px solid var(--line); border-radius:8px; margin:0 0 20px; padding:16px 18px 20px; }
  legend { padding:0 6px; font-size:12px; text-transform:uppercase; letter-spacing:.06em; opacity:.6; }
  label { display:block; margin:14px 0 5px; font-weight:500; }
  input[type=text],input[type=email],input[type=tel],input[type=date],input[type=number],select,textarea {
    width:100%; box-sizing:border-box; padding:8px 10px; font:inherit; color:inherit;
    background:transparent; border:1px solid var(--line); border-radius:6px;
  }
  textarea { min-height:78px; resize:vertical; }
  .row { display:flex; gap:14px; flex-wrap:wrap; }
  .row > div { flex:1 1 200px; min-width:0; }
  .check { display:flex; align-items:center; gap:8px; margin:10px 0; font-weight:400; }
  .check input { width:auto; }
  .check label { margin:0; font-weight:400; }
  button { margin-top:8px; padding:9px 18px; font:inherit; font-weight:600; color:#fff;
    background:var(--accent); border:0; border-radius:6px; cursor:pointer; }
  #result { margin-top:22px; padding:14px 16px; border:1px solid var(--line); border-radius:8px;
    background:color-mix(in srgb, var(--accent) 8%, transparent); white-space:pre-wrap;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12.5px; }
  [hidden] { display:none !important; }
</style>
<main>
  <h1>Account details</h1>
  <p class="sub">Nothing is sent anywhere — submitting only prints the values below.</p>

  <form id="f" novalidate>
    <fieldset>
      <legend>Contact</legend>
      <div class="row">
        <div><label for="first">First name</label><input type="text" id="first" name="first" autocomplete="off"></div>
        <div><label for="last">Last name</label><input type="text" id="last" name="last" autocomplete="off"></div>
      </div>
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" autocomplete="off">
      <label for="phone">Phone</label>
      <input type="tel" id="phone" name="phone" autocomplete="off">
    </fieldset>

    <fieldset>
      <legend>Details</legend>
      <div class="row">
        <div>
          <label for="country">Country</label>
          <select id="country" name="country">
            <option value="">Choose…</option>
            <option>Australia</option><option>Brazil</option><option>Canada</option>
            <option>Germany</option><option>India</option><option>Japan</option>
            <option>Singapore</option><option>United Kingdom</option><option>United States</option>
          </select>
        </div>
        <div><label for="started">Start date</label><input type="date" id="started" name="started"></div>
        <div><label for="seats">Seats</label><input type="number" id="seats" name="seats" min="1" max="500" step="1"></div>
      </div>
      <label for="notes">Notes</label>
      <textarea id="notes" name="notes"></textarea>
    </fieldset>

    <fieldset>
      <legend>Plan</legend>
      <div class="check"><input type="radio" name="plan" id="plan-starter" value="starter"><label for="plan-starter">Starter</label></div>
      <div class="check"><input type="radio" name="plan" id="plan-team" value="team"><label for="plan-team">Team</label></div>
      <div class="check"><input type="radio" name="plan" id="plan-enterprise" value="enterprise"><label for="plan-enterprise">Enterprise</label></div>
      <div class="check"><input type="checkbox" name="updates" id="updates"><label for="updates">Email me product updates</label></div>
    </fieldset>

    <button type="submit" id="submit">Save details</button>
  </form>

  <div id="result" hidden></div>
</main>
<script>
  document.getElementById("f").addEventListener("submit", (e) => {
    e.preventDefault();
    const d = new FormData(e.target);
    const lines = [];
    for (const [k, v] of d.entries()) lines.push(k.padEnd(10) + " " + v);
    if (!d.get("updates")) lines.push("updates    (unchecked)");
    if (!d.get("plan")) lines.push("plan       (none chosen)");
    const out = document.getElementById("result");
    out.textContent = "SAVED\n" + lines.join("\n");
    out.hidden = false;
  });
</script>
