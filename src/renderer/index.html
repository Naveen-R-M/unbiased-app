<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Unbiased</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
  </head>
  <body style="margin: 0">
    <style>
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-thumb { background: #3a3a40; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #4a4a52; }
      ::-webkit-scrollbar-track { background: transparent; }
      /* Annotation tints (CSS Custom Highlight API). Follows the default
         accent #FF563F; per-pane names, see ChatPane's highlight effects. */
      ::highlight(pending-main), ::highlight(pending-side) { background: rgba(255, 86, 63, 0.32); }
      ::highlight(annotations-main), ::highlight(annotations-side) { background: rgba(255, 86, 63, 0.22); }
      /* Sidebar activity dot for threads with a running turn. */
      @keyframes unbiased-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      /* Compaction spinner. */
      @keyframes unbiased-spin {
        to { transform: rotate(360deg); }
      }
      /* "is working" shimmer on sub-agent rows (Codex-style). */
      @keyframes unbiased-shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
